<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7ec8f2">
<title>Pigeon Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #7ec8f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* Overlay screens */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px; z-index: 10;
    background: rgba(40, 90, 130, 0.45);
    backdrop-filter: blur(2px);
  }
  .screen.hidden { display: none; }
  .title {
    font-size: clamp(40px, 13vw, 92px); font-weight: 900; letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 4px 0 #2e7bb0, 0 8px 24px rgba(0,0,0,.35);
    line-height: 0.95;
  }
  .emoji-title { font-size: clamp(54px, 17vw, 120px); line-height: 1; margin-bottom: 6px; }
  .sub {
    margin-top: 18px; font-size: clamp(16px, 4.5vw, 22px);
    color: #f3fbff; opacity: 0.97; max-width: 440px; line-height: 1.45;
  }
  .sub b { color: #fff36b; }
  .big {
    font-size: clamp(54px, 18vw, 120px); font-weight: 900; color: #fff36b;
    text-shadow: 0 4px 0 #c79a12, 0 10px 28px rgba(0,0,0,.4); line-height: 1;
  }
  .label {
    font-size: clamp(14px, 4vw, 18px); letter-spacing: 3px; text-transform: uppercase;
    color: #d9f1ff; margin-bottom: 6px;
  }
  .btn {
    margin-top: 30px; background: #ffd23c; color: #4a3500; border: none; border-radius: 999px;
    padding: 18px 46px; font-size: clamp(20px, 6vw, 26px); font-weight: 800;
    box-shadow: 0 6px 0 #c79a12, 0 10px 24px rgba(0,0,0,.35); cursor: pointer;
    transition: transform .05s ease;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c79a12; }
  .best { margin-top: 22px; font-size: clamp(15px, 4vw, 19px); color: #f3fbff; opacity: .9; }
  .hint { margin-top: 16px; font-size: clamp(13px, 3.6vw, 16px); color: #f3fbff; opacity: .75; }

  /* Fire button */
  #fireBtn {
    position: fixed; right: 22px; bottom: 26px; z-index: 9;
    width: 92px; height: 92px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 35% 30%, #ffb24a, #ff5a1f);
    box-shadow: 0 6px 0 #b8350c, 0 10px 22px rgba(0,0,0,.4);
    font-size: 44px; line-height: 1; cursor: pointer; display: none;
    align-items: center; justify-content: center; padding: 0;
  }
  #fireBtn.show { display: flex; }
  #fireBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8350c; }
  #fireCount {
    position: absolute; top: -6px; right: -6px;
    background: #fff; color: #ff5a1f; font-weight: 900;
    font-size: 18px; min-width: 26px; height: 26px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); padding: 0 6px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>

<button id="fireBtn" aria-label="Shoot fireball">🔥<span id="fireCount">0</span></button>

<!-- Start screen -->
<div id="startScreen" class="screen">
  <div class="emoji-title">🐦</div>
  <div class="title">PIGEON<br>DASH</div>
  <div class="sub">Fly forward and dodge the <b>🎈 balloons</b> and <b>🪁 kites</b>! Touch <b>higher</b> to fly up, <b>lower</b> to fly down. Grab <b>🎁 boxes</b> for hearts and power-ups!</div>
  <button class="btn" id="startBtn">PLAY</button>
  <div class="best" id="startBest"></div>
  <div class="hint">Hold and slide your finger up or down to fly</div>
</div>

<!-- Game over screen -->
<div id="overScreen" class="screen hidden">
  <div class="label">You flew</div>
  <div class="big" id="finalScore">0</div>
  <div class="best" id="overBest"></div>
  <button class="btn" id="retryBtn">FLY AGAIN</button>
  <div class="hint">Tap the button to try again</div>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const startScreen = document.getElementById("startScreen");
  const overScreen  = document.getElementById("overScreen");
  const startBtn    = document.getElementById("startBtn");
  const retryBtn    = document.getElementById("retryBtn");
  const finalScore  = document.getElementById("finalScore");
  const startBest   = document.getElementById("startBest");
  const overBest    = document.getElementById("overBest");
  const fireBtn     = document.getElementById("fireBtn");
  const fireCount   = document.getElementById("fireCount");

  let W = 0, H = 0, DPR = 1;

  // ---- Game state ----
  let state = "start"; // start | playing | over
  let score = 0, best = 0;
  try { best = parseInt(localStorage.getItem("pigeonDashBest") || "0", 10) || 0; } catch (e) {}

  const MAX_HEARTS = 5;
  let hearts = MAX_HEARTS;
  let speed = 0, distance = 0;
  let spawnTimer = 0, nextSpawn = 0;
  let boxTimer = 0, nextBox = 0;
  let obstacles = [];     // balloons + kites
  let boxes = [];         // power-up gift boxes
  let fireballs = [];     // player's shots
  let particles = [];
  let clouds = [];
  let lastTime = 0;
  let shake = 0;

  let invuln = 0;         // brief safety after a hit (seconds)
  let smashTime = 0;      // super-size smash remaining (seconds)
  let ammo = 0;           // fireball launcher shots
  let toast = null;       // { text, life }

  // The pigeon. Fixed x; player controls target altitude with touch Y.
  const pigeon = { x: 0, y: 0, targetY: 0, size: 70, vy: 0, tilt: 0, flap: 0 };

  function rand(a, b) { return a + Math.random() * (b - a); }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pigeon.size = Math.max(48, Math.min(W, H) * 0.12);
    pigeon.x = W * 0.22;
    if (state !== "playing") { pigeon.y = H * 0.5; pigeon.targetY = H * 0.5; }
    if (clouds.length === 0) seedClouds();
  }

  function seedClouds() {
    clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({ x: rand(0, W), y: rand(H * 0.08, H * 0.6), s: rand(40, 90), v: rand(8, 22) });
    }
  }

  function reset() {
    score = 0; distance = 0;
    hearts = MAX_HEARTS;
    speed = Math.max(180, W * 0.30);   // starts easy
    obstacles = []; boxes = []; fireballs = []; particles = [];
    spawnTimer = 0; nextSpawn = 1.2;
    boxTimer = 0; nextBox = 4.5;
    shake = 0; invuln = 0; smashTime = 0; ammo = 0; toast = null;
    pigeon.y = H * 0.5; pigeon.targetY = H * 0.5; pigeon.vy = 0; pigeon.tilt = 0;
    updateFireBtn();
  }

  function startGame() {
    reset();
    state = "playing";
    startScreen.classList.add("hidden");
    overScreen.classList.add("hidden");
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = "over";
    shake = 16;
    score = Math.floor(distance);
    if (score > best) {
      best = score;
      try { localStorage.setItem("pigeonDashBest", String(best)); } catch (e) {}
    }
    finalScore.textContent = score;
    overBest.textContent = "Best: " + best + " m";
    burst(pigeon.x + pigeon.size * 0.4, pigeon.y, "#cfd8e0", 26);
    updateFireBtn();
    setTimeout(() => overScreen.classList.remove("hidden"), 380);
  }

  // ---- Power-ups ----
  function collectBox(b) {
    boxes.splice(boxes.indexOf(b), 1);
    burst(b.x, b.y, "#ffe27a", 16);
    if (hearts < MAX_HEARTS) {
      hearts++;
      showToast("❤️ Heart!");
    } else {
      // Hearts are full -> grant a power-up.
      if (Math.random() < 0.5) {
        ammo += 3;
        updateFireBtn();
        showToast("🔥 Fireball Launcher!");
      } else {
        smashTime = 6;
        showToast("💪 Super-Size Smash!");
      }
    }
  }

  function showToast(text) { toast = { text: text, life: 1.6 }; }

  function updateFireBtn() {
    if (state === "playing" && ammo > 0) {
      fireBtn.classList.add("show");
      fireCount.textContent = ammo;
    } else {
      fireBtn.classList.remove("show");
    }
  }

  function shoot() {
    if (state !== "playing" || ammo <= 0) return;
    ammo--;
    updateFireBtn();
    fireballs.push({ x: pigeon.x + pigeon.size * 0.4, y: pigeon.y, r: pigeon.size * 0.32 });
    burst(pigeon.x + pigeon.size * 0.5, pigeon.y, "#ff8a3c", 8);
  }

  // ---- Particles ----
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 520,
        vy: (Math.random() - 0.5) * 520 - 60,
        life: 0.4 + Math.random() * 0.5, max: 0.9,
        r: 2 + Math.random() * 5, color: color
      });
    }
  }

  // ---- Spawning ----
  function spawnObstacle() {
    const isKite = Math.random() < 0.45;
    const size = Math.max(40, Math.min(W, H) * (isKite ? 0.11 : 0.10));
    const y = rand(size, H - size * (isKite ? 2.4 : 1.2));
    obstacles.push({
      type: isKite ? "kite" : "balloon",
      emoji: isKite ? "🪁" : (Math.random() < 0.5 ? "🎈" : "🎈"),
      x: W + size, y: y, size: size,
      // kites have a dangling string that also hurts
      stringLen: isKite ? size * 1.6 : 0,
      bob: rand(0, Math.PI * 2)
    });
  }

  function spawnBox() {
    const size = Math.max(42, Math.min(W, H) * 0.11);
    boxes.push({ x: W + size, y: rand(size, H - size), size: size, bob: rand(0, Math.PI * 2) });
  }

  // ---- Input: altitude follows finger / pointer Y ----
  function pointAt(e) {
    if (state !== "playing") return;
    const t = (e.touches && e.touches[0]) ? e.touches[0] : e;
    if (typeof t.clientY === "number") {
      pigeon.targetY = Math.max(pigeon.size * 0.4, Math.min(H - pigeon.size * 0.4, t.clientY));
    }
  }
  canvas.addEventListener("pointerdown", pointAt);
  canvas.addEventListener("pointermove", function (e) {
    if (e.pointerType === "mouse" && e.buttons === 0) { pointAt(e); return; }
    pointAt(e);
  });
  // Keyboard for desktop testing.
  window.addEventListener("keydown", function (e) {
    if (state === "playing") {
      if (e.key === "ArrowUp")   pigeon.targetY = Math.max(pigeon.size * 0.4, pigeon.targetY - H * 0.12);
      if (e.key === "ArrowDown") pigeon.targetY = Math.min(H - pigeon.size * 0.4, pigeon.targetY + H * 0.12);
      if (e.key === " " || e.key === "f") shoot();
    }
  });

  fireBtn.addEventListener("pointerdown", function (e) {
    e.preventDefault(); e.stopPropagation(); shoot();
  });

  startBtn.addEventListener("click", startGame);
  retryBtn.addEventListener("click", startGame);

  // ---- Collision helpers ----
  function hitPigeon(cx, cy, cr) {
    const dx = cx - pigeon.x, dy = cy - pigeon.y;
    const rr = cr + pigeon.size * 0.36;
    return dx * dx + dy * dy < rr * rr;
  }

  function update(dt) {
    distance += speed * dt * 0.05;
    // Gentle ramp: starts easy, slowly speeds up.
    speed += dt * 7;

    if (invuln > 0) invuln -= dt;
    if (smashTime > 0) smashTime -= dt;
    if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }

    // Pigeon eases toward the target altitude.
    const prevY = pigeon.y;
    pigeon.y += (pigeon.targetY - pigeon.y) * Math.min(1, dt * 9);
    pigeon.vy = (pigeon.y - prevY) / Math.max(dt, 0.0001);
    pigeon.tilt = Math.max(-0.5, Math.min(0.5, pigeon.vy * 0.0012));
    pigeon.flap += dt * 14;

    // Clouds drift.
    for (const c of clouds) {
      c.x -= c.v * dt;
      if (c.x < -c.s * 2) { c.x = W + c.s; c.y = rand(H * 0.08, H * 0.6); }
    }

    // Spawn obstacles.
    spawnTimer += dt;
    if (spawnTimer >= nextSpawn) {
      spawnTimer = 0;
      spawnObstacle();
      // closer together as it speeds up, but never brutal
      nextSpawn = Math.max(0.7, rand(1.3, 1.9) - distance * 0.0008);
    }
    // Spawn boxes occasionally.
    boxTimer += dt;
    if (boxTimer >= nextBox) {
      boxTimer = 0; spawnBox();
      nextBox = rand(4.5, 7.5);
    }

    // Move + collide obstacles.
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed * dt;
      o.bob += dt * 3;
      if (o.x < -o.size * 2) { obstacles.splice(i, 1); continue; }

      // Fireball hits.
      let destroyed = false;
      for (let j = fireballs.length - 1; j >= 0; j--) {
        const f = fireballs[j];
        const dx = f.x - o.x, dy = f.y - o.y;
        const rr = f.r + o.size * 0.45;
        if (dx * dx + dy * dy < rr * rr) {
          burst(o.x, o.y, "#ff7a3c", 16);
          obstacles.splice(i, 1); fireballs.splice(j, 1);
          destroyed = true; break;
        }
      }
      if (destroyed) continue;

      // Player collision (balloon body + kite string).
      let touched = hitPigeon(o.x, o.y, o.size * 0.45);
      if (!touched && o.stringLen > 0) {
        // string hangs below the kite
        const sx = o.x;
        const topY = o.y + o.size * 0.3, botY = o.y + o.stringLen;
        if (pigeon.x > sx - pigeon.size * 0.4 && pigeon.x < sx + pigeon.size * 0.4 &&
            pigeon.y > topY - pigeon.size * 0.3 && pigeon.y < botY + pigeon.size * 0.3) {
          touched = true;
        }
      }
      if (touched) {
        if (smashTime > 0) {
          burst(o.x, o.y, "#ffd23c", 18);
          obstacles.splice(i, 1);
          shake = 8;
        } else if (invuln <= 0) {
          hearts--;
          invuln = 1.1;
          shake = 12;
          burst(o.x, o.y, "#ff5a5a", 16);
          obstacles.splice(i, 1);
          if (hearts <= 0) { gameOver(); return; }
        }
      }
    }

    // Move + collect boxes.
    for (let i = boxes.length - 1; i >= 0; i--) {
      const b = boxes[i];
      b.x -= speed * dt * 0.92;
      b.bob += dt * 3;
      if (b.x < -b.size * 2) { boxes.splice(i, 1); continue; }
      if (hitPigeon(b.x, b.y, b.size * 0.42)) { collectBox(b); }
    }

    // Move fireballs.
    for (let i = fireballs.length - 1; i >= 0; i--) {
      const f = fireballs[i];
      f.x += (speed + 600) * dt;
      if (f.x > W + 80) fireballs.splice(i, 1);
    }

    // Particles.
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 900 * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 60);
  }

  // ---- Drawing ----
  function drawEmoji(emoji, x, y, size, rot) {
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.font = size + "px -apple-system, 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(emoji, 0, 0);
    ctx.restore();
  }

  function draw() {
    // Sky gradient.
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#5fb6ee");
    g.addColorStop(1, "#bfe6ff");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Sun.
    drawEmoji("☀️", W * 0.86, H * 0.16, Math.min(W, H) * 0.14, 0);

    // Clouds.
    ctx.globalAlpha = 0.9;
    for (const c of clouds) drawEmoji("☁️", c.x, c.y, c.s, 0);
    ctx.globalAlpha = 1;

    let sx = 0, sy = 0;
    if (shake > 0) { sx = rand(-shake, shake); sy = rand(-shake, shake); }
    ctx.save();
    ctx.translate(sx, sy);

    // Boxes.
    for (const b of boxes) {
      const yy = b.y + Math.sin(b.bob) * 6;
      // little sparkle ring so kids spot them as good
      ctx.save();
      ctx.globalAlpha = 0.5;
      drawEmoji("✨", b.x, yy, b.size * 1.25, 0);
      ctx.restore();
      drawEmoji("🎁", b.x, yy, b.size, 0);
    }

    // Obstacles.
    for (const o of obstacles) {
      const yy = o.y + Math.sin(o.bob) * 5;
      if (o.stringLen > 0) {
        // kite string
        ctx.strokeStyle = "rgba(80,60,40,0.65)";
        ctx.lineWidth = Math.max(2, o.size * 0.05);
        ctx.beginPath();
        ctx.moveTo(o.x, yy + o.size * 0.25);
        ctx.lineTo(o.x, o.y + o.stringLen);
        ctx.stroke();
      }
      drawEmoji(o.emoji, o.x, yy, o.size, 0);
    }

    // Fireballs.
    for (const f of fireballs) drawEmoji("🔥", f.x, f.y, f.r * 2.2, 0);

    // Pigeon (flashing while invulnerable).
    const flashing = invuln > 0 && Math.floor(invuln * 12) % 2 === 0;
    if (!flashing) {
      const scale = smashTime > 0 ? 1.6 : 1;
      const wing = Math.sin(pigeon.flap) * 0.08;
      if (smashTime > 0) {
        ctx.save(); ctx.globalAlpha = 0.45;
        drawEmoji("💪", pigeon.x, pigeon.y, pigeon.size * scale * 1.4, 0);
        ctx.restore();
      }
      drawEmoji("🐦", pigeon.x, pigeon.y, pigeon.size * (scale + wing), pigeon.tilt);
    }

    // Particles.
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // ---- HUD ----
    // Hearts (big & legible).
    const hs = Math.max(26, Math.min(W, H) * 0.06);
    for (let i = 0; i < MAX_HEARTS; i++) {
      drawEmoji(i < hearts ? "❤️" : "🤍", 18 + hs * 0.5 + i * (hs * 0.95), 14 + hs * 0.5, hs, 0);
    }

    // Score.
    ctx.fillStyle = "#0c3550";
    ctx.font = "900 " + Math.max(22, Math.min(W, H) * 0.06) + "px -apple-system, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    ctx.fillText(Math.floor(distance) + " m", W - 18, 14);

    // Smash timer pill.
    if (smashTime > 0) {
      ctx.textAlign = "center";
      ctx.font = "800 " + Math.max(16, Math.min(W, H) * 0.04) + "px -apple-system, sans-serif";
      ctx.fillStyle = "#b8350c";
      ctx.fillText("💪 SMASH " + Math.ceil(smashTime) + "s", W * 0.5, 16);
    }

    // Toast announcement.
    if (toast) {
      ctx.globalAlpha = Math.min(1, toast.life);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 " + Math.max(26, Math.min(W, H) * 0.075) + "px -apple-system, sans-serif";
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "rgba(12,53,80,0.85)";
      ctx.lineWidth = 6;
      ctx.strokeText(toast.text, W * 0.5, H * 0.3);
      ctx.fillText(toast.text, W * 0.5, H * 0.3);
      ctx.globalAlpha = 1;
    }
  }

  function loop(now) {
    if (state !== "playing") return;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05; // clamp big gaps
    update(dt);
    if (state === "playing") { draw(); requestAnimationFrame(loop); }
  }

  // Idle/menu animation so the start screen isn't a frozen canvas.
  function idle(now) {
    if (state === "playing") return;
    const dt = Math.min(0.05, (now - (idle._t || now)) / 1000);
    idle._t = now;
    for (const c of clouds) {
      c.x -= c.v * dt;
      if (c.x < -c.s * 2) { c.x = W + c.s; c.y = rand(H * 0.08, H * 0.6); }
    }
    pigeon.flap += dt * 6;
    pigeon.y = H * 0.5 + Math.sin(now * 0.002) * H * 0.04;
    draw();
    requestAnimationFrame(idle);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);

  // Boot.
  resize();
  startBest.textContent = best > 0 ? "Best: " + best + " m" : "";
  requestAnimationFrame(idle);
})();
</script>
</body>
</html>
